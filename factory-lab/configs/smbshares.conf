[global]
    workgroup = FACTORY
    netbios name = FACTORY-SMB
    server string = Factory File Server
    security = user
    log file = /var/log/samba/%m.log
    max log size = 5000

    # Browseable network
    browseable = yes
    printcap name = /dev/null

# ========== DEPARTMENT SHARES ==========

[Production]
    path = /srv/shares/Production
    comment = Production Department Files
    read only = No
    create mask = 0755
    directory mask = 0755
    valid users = @Production_@Manager
    force group = +Production

[Maintenance]
    path = /srv/shares/Maintenance
    comment = Maintenance Department Files
    read only = No
    create mask = 0755
    directory mask = 0755
