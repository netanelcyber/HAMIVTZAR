[global]
    realm = FACTORY.LOCAL
    workgroup = FACTORY
    netbios name = FACTORY-DC
    server role = active directory domain controller
    dns forwarder = 8.8.8.8
    security = user

    # Logging
    log level = 3
    log file = /var/log/samba/%m.log
    max log size = 5000

    # Performance
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
    deadtime = 15
    use mmap = yes

    # Encryption and signing
    smb encrypt = default
    server signing = default

[netlogon]
    path = /var/lib/samba/sysvol/factory.local/scripts
    read only = No

[sysvol]
    path = /var/lib/samba/sysvol
    read only = No
